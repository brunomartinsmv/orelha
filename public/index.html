<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orelha</title>
  <meta name="description" content="Seu diário de leitura.">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0e1714">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2efe3">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Orelha">
  <link rel="manifest" href="/manifest.webmanifest?v=2">
  <link rel="icon" href="/icons/icon.svg?v=3" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=2">
  <link rel="preload" href="/fonts/young-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/instrument-sans.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Tema escolhido no botão do topo, antes do primeiro desenho (sem piscar).
    try {
      if (navigator.standalone) document.documentElement.classList.add('standalone');
      var t = localStorage.getItem('orelha.theme');
      if (t === 'light' || t === 'dark') {
        document.documentElement.dataset.theme = t;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.dataset.media = m.getAttribute('media'); m.removeAttribute('media');
          m.content = t === 'light' ? '#f2efe3' : '#0e1714';
        });
      }
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/app/main.js"></script>
</body>
</html>
