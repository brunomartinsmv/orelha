name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'docs/**'
      - 'public/fonts/**'
      - 'public/icons/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Montar artefato estático
        run: |
          mkdir -p _site/fonts _site/icons _site/docs
          cp -r site/* _site/
          cp -r public/fonts/* _site/fonts/
          cp -r public/icons/* _site/icons/
          cp docs/*.png docs/demo.mp4 docs/demo.webp _site/docs/
          ver="${GITHUB_SHA:0:7}"
          sed -i "s|./styles.css|./styles.css?v=${ver}|g; s|./docs/demo.mp4|./docs/demo.mp4?v=${ver}|g" _site/index.html
          touch _site/.nojekyll

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
